name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Coverage thresholds are in vitest.config.ts; a run under them fails.
      - run: bun run test:coverage

  # The guides, examples and generated data: links and anchors resolve, every listed version has its
  # API document and changelog, and each line's examples typecheck against its pinned meocord. The
  # pipeline's own tests run in Test.
  content:
    name: Content
    runs-on: ubuntu-latest
    # The servers the cooldown store recipes are checked against; a spec whose server is missing fails here
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: examples
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8.10.2@sha256:718f745deb7dfefeac6eed7041fc7ec9476b50e61b247932682457c41adafa0e
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
      mongodb:
        # 8.2: 8.0 refuses to start on Linux 6.19 and later
        image: mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
        ports: ['27017:27017']
        options: --health-cmd "mongosh --quiet --eval 1" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run content:check
      # The mark, a verbatim copy of meocord main's tools/brand/mark.json
      - run: bun run brand:check
      - run: bun run examples:check
        env:
          TEST_POSTGRES_URL: postgres://postgres:examples@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379
          TEST_MONGODB_URL: mongodb://localhost:27017/examples
      # The home page's pipeline demo, recorded from the example it shows
      - run: bun run home:trace --check

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build 2>&1 | tee build.log
      # Prerendering every page within 180 s, so the growth of exact-version pages shows early
      - run: bun scripts/check-static-generation.ts build.log
      # @meonode/compiler leaves __meo$ markers in what it compiles; none means the SWC plugin did not load
      - name: Check the meonode compiler ran
        run: |
          markers=$(grep -ro '__meo\$:' .next/server | wc -l)
          echo "meonode compiler markers in .next/server: $markers"
          test "$markers" -gt 0
      # First-load JS of every prerendered page, gzipped, against the 220 KB budget
      - run: bun run budget:js
      - run: bun --bun x playwright install --with-deps chromium
      # Everything but the timed runs, which have runners of their own below
      - run: bun run test:e2e --grep-invert @performance
      # Every docs route under next dev: its validation errors never reach the production build
      - run: bun run check:dev-routes
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The largest-paint budgets, measured on runners that run nothing else meanwhile, a few pages each,
  # every one calibrating its CPU slowdown to itself.
  performance:
    name: Performance (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun --bun x playwright install --with-deps chromium
      - run: bun run test:e2e --grep @performance
        env:
          PERF_SHARD: ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-performance-${{ strategy.job-index }}
          path: playwright-report
          retention-days: 7

  # The check branch protection requires: the build, the e2e suite and every performance shard passed.
  build-and-e2e:
    name: Build and e2e
    if: always()
    needs: [e2e, performance]
    runs-on: ubuntu-latest
    steps:
      - run: test "$E2E" = success && test "$PERFORMANCE" = success
        env:
          E2E: ${{ needs.e2e.result }}
          PERFORMANCE: ${{ needs.performance.result }}

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built on every change so a broken Dockerfile fails before main; only `publish` pushes.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: docs:ci
          build-args: BUILD_VERSION=${{ github.sha }}
      - name: Start the image and check health
        run: |
          docker run -d --name docs -p 3000:3000 docs:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs docs
          exit 1

  # The only job with write access, run on main alone, after everything else passed. It installs
  # nothing outside the Docker build.
  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, content, build-and-e2e, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          build-args: BUILD_VERSION=${{ github.sha }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
